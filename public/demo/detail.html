# 多模态 Agent Workflow 可视化编排网站
> 面向AI应用开发者的可视化工作流搭建平台，支持多模态大模型Agent节点拖拽编排，自动执行、调试、导出Agent流程。

<div class="tag-group">
<span class="tag">Web应用</span>
<span class="tag">Agent工作流</span>
<span class="tag">多模态</span>
<span class="tag">可视化拖拽</span>
<span class="tag">前端: Vue3 + Canvas</span>
<span class="tag">后端: Python FastAPI</span>
</div>

## 项目概述
本项目是一套**design-driven**的多模态Agent工作流编排系统。
用户可以在网页画布上，通过拖拽节点的方式搭建AI Agent执行链路，串联文本、图像、音频、文件等多模态输入，支持分支判断、循环调用、工具调用、结果回写。
无需编写代码，即可快速组装、调试和部署AI智能体流程。

## 系统架构（思维导图 mindmap）
\`\`\`mermaid
mindmap
  root((多模态Agent Workflow系统))
    前端可视化层
      Canvas拖拽画布
      节点配置表单
      SSE实时日志面板
      撤销/重做、导入导出
    Workflow编排引擎
      DAG解析器
      节点调度器
      断点续跑模块
      流程校验器(防循环依赖)
    Agent内核服务
      LLM文本节点
      VLM多模态视觉节点
      语音转写/OCR
      自定义工具调用
    存储&中间件
      SQLite 工作流元数据
      Redis 任务队列+状态缓存
    扩展插件层
      第三方模型接入
      模板市场
      自定义节点
\`\`\`

## 数据流流程图（flowchart）
\`\`\`mermaid
flowchart LR
    A[用户画布编排] --> B[DAG工作流JSON]
    B --> C[Workflow调度引擎]
    C --> D{节点类型分发}
    D --> E[文本LLM节点]
    D --> F[多模态VLM节点]
    D --> G[自定义工具节点]
    E & F & G --> H[结果聚合 + 状态回写]
\`\`\`

<div class="grid-2">
<div class="card danger">
<h4>🔴 核心难点</h4>
<ul>
<li><strong>DAG工作流校验：</strong>实时检测循环依赖、空节点、无效连线，在画布编辑阶段提前拦截非法流程。</li>
<li><strong>多模态异构节点调度：</strong>不同模型/工具执行耗时差异巨大，需要异步队列+断点续执行，防止单节点阻塞整个流程。</li>
<li><strong>可视化画布性能：</strong>大量节点连线渲染，避免拖拽卡顿，优化Canvas重绘策略。</li>
<li><strong>状态持久化：</strong>工作流中途暂停、失败重试，保留每个节点输入输出上下文。</li>
</ul>
</div>

<div class="card">
<h4>🟢 项目亮点</h4>
<ul>
<li><strong>低代码编排：</strong>纯拖拽搭建Agent，降低AI智能体开发门槛，非开发人员也可以搭建多模态任务。</li>
<li><strong>原生多模态支持：</strong>统一封装图片、音频、文档输入，VLM视觉模型直接接入工作流。</li>
<li><strong>实时调试面板：</strong>单步执行、节点日志、输入输出预览，快速定位Agent链路问题。</li>
<li><strong>工作流模板市场：</strong>支持导出JSON模板，可以复用、分享Agent流程。</li>
<li><strong>设计驱动：</strong>画布UI注重信息层级，节点类型用色彩区分，交互简洁，符合专业开发者使用习惯。</li>
</ul>

## 核心功能清单
- 可视化拖拽画布，节点连线，支持撤销/重做
- DAG自动校验，防止循环依赖
- 多模态节点：文本大模型、视觉VLM、OCR、语音转写、文件解析
- 流程控制：条件分支、循环、等待节点
- 工具调用：内置代码执行、HTTP请求
- 执行调试：单步运行、批量执行、执行日志、节点输入输出查看
- 导入/导出工作流JSON模板
- 权限：工作流保存、项目管理

## 技术栈
**前端**
- Vue3 + Pinia
- Canvas 画布引擎（自研，非第三方拖拽库）
- TypeScript
- SSE 实时推送执行日志

**后端**
- Python FastAPI
- Pydantic 数据校验
- Redis 任务队列
- SQLite 持久化存储
- LangGraph 作为Agent底层调度参考
